:root{
  --paper:#F2F5F8;--card:#FAFCFD;--line:#D5DEE6;
  --blue:#13293D;--blue-dk:#0B1826;--blue-soft:#E2EFF7;--on-blue:#B8BFC5;
  --gold:#3E92CC;--gold-soft:#E2EFF7;--hi:#8BBEE0;
  --ink:#16324F;--muted:#2A628F;
  --bad:#A63A2F;--bad-soft:#F8E5E1;--good:#2F6B3A;--good-soft:#E2EFE3;
  --warm:#B5642A;--warm-soft:#F6EADF;--cool:#2F3E4A;--cool-soft:#E3E7EA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{font-family:'Fatimah',system-ui,sans-serif;color:var(--ink);direction:rtl;-webkit-font-smoothing:antialiased}
bdi.ltr{direction:ltr;unicode-bidi:isolate;font-family:'Fatimah',Georgia,serif}

#stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;background:var(--paper);overflow:hidden;flex:none}

.slide{position:absolute;inset:0;padding:40px 64px 78px;display:none;flex-direction:column;align-items:center}
.slide.active{display:flex}
.slide.active .a{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.slide .body{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:top center;min-height:0}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes growline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* زخارف */
.orn{position:absolute;border-radius:50%;pointer-events:none}
.orn.o1{width:340px;height:340px;border:1.5px solid var(--line);top:-120px;left:-120px;opacity:.7}
.orn.o2{width:220px;height:220px;border:1.5px dashed var(--line);bottom:-70px;right:-70px;opacity:.7}
.orn.o3{width:14px;height:14px;background:var(--gold);opacity:.55;top:118px;right:170px}
.orn.o4{width:9px;height:9px;background:var(--blue);opacity:.22;bottom:150px;left:210px}

/* رأس الشريحة */
.head{display:flex;flex-direction:column;align-items:center;flex:none}
.kicker{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--blue);font-size:19px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:100px;padding:2px 18px}
.kicker.dim{background:var(--card);border-color:var(--line)}
.kicker.dk{background:var(--blue);color:var(--hi);border-color:var(--blue)}
.title-row{display:flex;align-items:center;gap:22px;margin-top:8px}
.title-row .tline{height:2.5px;width:90px;background:var(--gold);transform-origin:center;animation:growline .9s .35s both}
.slide-title{font-weight:700;color:var(--blue);font-size:42px;line-height:1.3;text-align:center}

/* نصوص عامة */
.hook-big{font-size:calc(46px*var(--fz,1));font-weight:700;color:var(--blue);text-align:center;line-height:1.5}
.hook-sub{font-size:calc(23px*var(--fz,1));margin-top:14px;color:var(--ink);text-align:center;line-height:1.75}
.lead{font-size:calc(22px*var(--fz,1));color:var(--muted);text-align:center;line-height:1.6;margin-top:14px;max-width:1080px}
.punch{margin-top:18px;background:var(--gold-soft);border:1.5px dashed var(--blue);border-radius:100px;padding:10px 32px;font-size:calc(20px*var(--fz,1));font-weight:700;color:var(--blue);text-align:center;line-height:1.55;max-width:1100px}
.punch.dk{background:var(--blue);color:#fff;border:0}
.punch.dk b{color:var(--hi)}

/* ═══ الغلاف ═══ */
.cov-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center;width:1140px;gap:24px}
.cov-text{text-align:center}
.cov-logo{display:flex;align-items:center;gap:18px;justify-content:center}
.cov-logo img{height:64px}
.cov-logo .sep{width:1.5px;height:50px;background:var(--line)}
.cov-logo .sn{font-size:18px;font-weight:700;color:var(--blue);line-height:1.4;text-align:right}
.cover-kicker{font-size:19px;line-height:1.5;max-width:100%;color:var(--blue);font-weight:700;margin-top:18px;background:var(--gold-soft);border:1.5px solid var(--gold);display:inline-block;border-radius:100px;padding:2px 20px}
.cover-label{font-size:26px;color:var(--muted);font-weight:500;margin-top:14px}
.cover-title{font-weight:900;font-size:var(--ct,78px);color:var(--blue);line-height:1.2;margin:2px 0}
.cover-lines{display:flex;align-items:center;justify-content:center;gap:24px;margin:16px 0 10px}
.cover-lines .l{height:2.5px;width:150px;background:var(--gold);transform-origin:center;animation:growline 1s .5s both}
.cover-lines .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);animation:pop .6s .9s both}
.cover-sub{font-size:24px;color:var(--ink);line-height:1.7;font-weight:500}
.ph-wrap{position:relative;width:440px;height:470px;margin:0 auto}
.ph-ring{position:absolute;top:20px;left:50%;margin-left:-212px;width:424px;height:424px;border-radius:50%;border:2.5px dashed var(--gold);animation:spin-slow 36s linear infinite}
.ph-circle{position:absolute;top:36px;left:50%;margin-left:-196px;width:392px;height:392px;border-radius:50%;overflow:hidden;border:6px solid #fff;box-shadow:0 18px 40px rgba(19,41,61,.22)}
.ph-circle img{width:100%;height:100%;object-fit:cover}
.ph-badge{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--blue);color:#fff;font-weight:700;font-size:18px;border-radius:100px;padding:8px 26px;box-shadow:0 8px 20px rgba(19,41,61,.3)}
.ph-badge b{color:var(--hi)}

/* ═══ بطاقات عامة ═══ */
.grid{display:grid;gap:18px;width:1140px;margin-top:22px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px 18px;text-align:center;position:relative;overflow:hidden}
.cd:after{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--cc,var(--gold))}
.num{width:44px;height:44px;border-radius:50%;background:var(--nc,var(--blue));color:var(--nt,#fff);font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;flex:none}
.cd .num{margin:0 auto 12px}
.cd h4{color:var(--blue);font-weight:700;font-size:calc(21px*var(--fz,1));line-height:1.4}
.cd p{font-size:calc(21px*var(--fz,1));color:var(--ink);line-height:1.65}
.cd.big p{font-size:calc(23px*var(--fz,1));font-weight:500}

/* قائمة صفوف */
.rows{display:grid;gap:12px;width:1100px;margin-top:22px}
.rows.two{grid-template-columns:1fr 1fr;gap:12px 18px}
.rrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-right:5px solid var(--rc,var(--blue));border-radius:14px;padding:8px 16px;font-size:calc(23px*var(--fz,1));line-height:1.5;font-weight:500}
.rrow .num{width:34px;height:34px;font-size:18px;--nc:var(--gold);--nt:var(--blue)}

/* ═══ الافتتاح ═══ */
.hook-grid{display:grid;grid-template-columns:1fr 440px;gap:34px;align-items:center;width:1150px;margin-top:10px}
.qbox{background:var(--blue);border-radius:22px;padding:28px 40px 28px 110px;position:relative;text-align:right}
.qbox .qm{position:absolute;left:30px;top:50%;margin-top:-46px;font-size:84px;font-weight:900;color:var(--hi);line-height:1;animation:floaty 3s ease-in-out infinite}
.qbox p{font-size:calc(30px*var(--fz,1));color:#fff;line-height:1.6;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:100px;padding:9px 24px;font-size:calc(19px*var(--fz,1));font-weight:700;color:var(--blue)}

/* ═══ صورة الكتاب ═══ */
.fig{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 14px 30px rgba(19,41,61,.10);cursor:zoom-in;position:relative}
.fig img{display:block;max-width:100%;max-height:var(--figmax,430px);margin:0 auto;border-radius:10px}
.fig .zoom{position:absolute;bottom:14px;left:14px;width:36px;height:36px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
.fig .zoom svg{width:18px;height:18px}
.fig-cap{font-size:calc(19px*var(--fz,1));color:var(--muted);margin-top:14px;text-align:center;max-width:1000px;line-height:1.6}

/* ═══ البطاقات القلّابة ═══ */
.fq{perspective:1200px;cursor:pointer;min-height:190px}
.fq-inner{position:relative;width:100%;height:100%;min-height:inherit;display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.fq.open .fq-inner{transform:rotateY(180deg)}
.fq-face{grid-area:1/1;position:relative;min-height:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 22px;text-align:center;overflow:hidden}
.fq-front{background:var(--card);border:1.5px solid var(--line)}
.fq-front:after{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--gold)}
.fq-front h4{font-size:calc(27px*var(--fz,1));font-weight:700;color:var(--blue);line-height:1.4}
.fq-front .q{font-size:calc(22px*var(--fz,1));font-weight:700;color:var(--ink);line-height:1.6}
.fq-front .hint{margin-top:12px;font-size:15px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.fq-front .hint svg{width:16px;height:16px}
.fq-front .tag{position:absolute;top:14px;right:16px;font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:100px;padding:2px 12px}
.fq-back{transform:rotateY(180deg);background:var(--blue);color:#fff}
.fq-back .t{font-size:calc(17px*var(--fz,1));font-weight:700;color:var(--hi);margin-bottom:8px}
.fq-back p{font-size:calc(22px*var(--fz,1));line-height:1.7}
.reveal-all{margin-top:16px;background:none;border:1.5px solid var(--blue);color:var(--blue);font:700 16px 'Fatimah';border-radius:100px;padding:6px 20px;cursor:pointer}
.reveal-all:hover{background:var(--blue);color:#fff}

/* ═══ الجدول ═══ */
.tbl{width:1140px;margin-top:20px;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.tbl th{background:var(--blue);color:#fff;font-size:calc(19px*var(--fz,1));font-weight:700;padding:12px 16px;text-align:right}
.tbl td{font-size:calc(20px*var(--fz,1));line-height:1.55;padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:nth-child(even) td{background:#F1F5F7}
.tbl td:first-child{font-weight:700;color:var(--blue)}
.tbl th:first-child{border-left:0}

/* ═══ المقارنة ═══ */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:26px;width:1100px;margin-top:24px}
.mv{border-radius:20px;padding:22px 28px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.mv:after{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:var(--vc)}

.mv li:before{content:'';position:absolute;right:0;top:.72em;width:9px;height:9px;border-radius:50%;background:var(--vc)}
.mv.good{--vc:var(--good);--vs:var(--good-soft)}

/* ═══ الخطوات ═══ */
.steps{display:grid;gap:0;width:1150px;margin-top:26px;position:relative}

.stp .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:14px;min-height:170px}
.stp h4{font-size:calc(21px*var(--fz,1));font-weight:700;color:var(--blue);line-height:1.4}
.stp p{font-size:calc(20px*var(--fz,1));line-height:1.65;margin-top:8px}
.steps .rail{position:absolute;top:31px;height:0;border-top:2.5px dashed var(--blue);opacity:.45;z-index:1}

/* ═══ القاعدة ═══ */
.def-box{width:1080px;background:var(--blue);border-radius:24px;padding:34px 60px;text-align:center;margin-top:24px;position:relative}
.def-box:before{content:'❞';position:absolute;top:-4px;right:26px;font-size:74px;color:var(--hi);opacity:.9;font-family:Georgia,serif}
.def-box .lb{display:inline-block;background:var(--gold);color:var(--blue);font-weight:700;font-size:calc(18px*var(--fz,1));border-radius:100px;padding:3px 18px;margin-bottom:14px}

.ex-grid{display:grid;grid-template-columns:1fr;gap:22px;width:1140px;margin-top:18px;align-items:center}
.ex-grid.wf{grid-template-columns:1fr 420px}
.scn{background:var(--blue-soft);border-radius:18px;padding:14px 22px;font-size:calc(23px*var(--fz,1));line-height:1.6;position:relative}
.scn .lb{display:inline-block;background:var(--blue);color:#fff;font-size:15px;font-weight:700;border-radius:100px;padding:2px 14px;margin-bottom:6px}
.rev .rrow{transition:opacity .45s,filter .45s,transform .45s}
.rev .rrow.hid{opacity:.12;filter:blur(3px);transform:translateX(-8px)}
.rev-btn{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:100px;padding:8px 22px;font:700 17px 'Fatimah';cursor:pointer}
.rev-btn svg{width:18px;height:18px}
.rev-btn[disabled]{opacity:.35;cursor:default}

/* ═══ النشاط ═══ */
.act-top{display:flex;align-items:center;gap:14px;width:1140px;margin-top:18px}
.act-top .scn{flex:1}
.timer{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;flex:none;width:170px}
.timer .clk{font-size:34px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.timer .clk.run{color:var(--good)}
.timer .clk.end{color:var(--bad);animation:pop .5s}
.timer .bt{display:flex;gap:6px}
.timer button{border:1.5px solid var(--blue);background:none;color:var(--blue);border-radius:100px;padding:2px 10px;font:700 14px 'Fatimah';cursor:pointer}
.timer button:hover{background:var(--blue);color:#fff}
.timer .ic{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:700}
.timer .ic svg{width:16px;height:16px}

/* ═══ الختام ═══ */
.close-grid{display:grid;grid-template-columns:1fr 380px;gap:26px;width:1150px;margin-top:22px;align-items:stretch}
.hw{background:var(--blue);border-radius:20px;padding:24px 26px;color:#fff;position:relative;overflow:hidden}
.hw:before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:var(--gold)}
.hw h3{color:var(--hi);font-size:calc(23px*var(--fz,1));font-weight:700;display:flex;align-items:center;gap:8px}
.hw h3 svg{width:22px;height:22px}
.hw p{font-size:calc(21px*var(--fz,1));line-height:1.75;margin-top:12px}

/* ═══ النافذة المنبثقة ═══ */
.pop{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(11,24,38,.62);backdrop-filter:blur(4px);padding:30px}
.pop.on{display:flex;animation:fadein .3s}
.pbox{background:#fff;border-radius:22px;padding:18px;position:relative;max-width:1180px;max-height:660px;display:flex;align-items:center;justify-content:center}

#notes{position:absolute;right:0;left:0;bottom:0;z-index:65;background:var(--blue-dk);color:#fff;padding:14px 64px 16px;font-size:18px;line-height:1.7;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}

.cover-slide ~ #dots{}

<script>/* محرّك عروض «الجيولوجيا ١١» — يبني الشرائح من window.DECK بأسلوب «المعاتيق» وهوية علي الدمخي */
(function () {
  const D = window.DECK, A = window.ASSETS;
  const AR = '٠١٢٣٤٥٦٧٨٩';
  const ORD = { 1: 'الأولى', 2: 'الثانية', 3: 'الثالثة', 4: 'الرابعة', 5: 'الخامسة' };
  const toAr = s => String(s).replace(/\d/g, d => AR[d]);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // نص آمن: المقاطع الرياضية/اللاتينية تُعزل LTR وتبقى أرقامها غربية، وبقية الأرقام مشرقية
  function tx(s) {
    const parts = String(s).split(/(\(?[A-Za-z0-9ⁿ²³₀-₉~][A-Za-z0-9ⁿ²³₀-₉·° +\-−×÷=^.\/%]*[A-Za-z0-9ⁿ²³₀-₉)%°])/);
    return parts.map((p, i) => {
      if (i % 2 && /[A-Za-zⁿ]/.test(p) && /[\d+\-−×÷=^ⁿ²³₀-₉·°]/.test(p)) {
        const o = p.startsWith('(') && !p.includes(')', 1) ? '(' : '';
        return (o) + '<bdi class="ltr">' + esc(o ? p.slice(1) : p) + '</bdi>';
      }
      return toAr(esc(p)).replace(/(\d|[٠-٩])\.(?=[٠-٩])/g, '$1٫').replace(/%/g, '٪');
    }).join('');
  }
  const I = {
    flip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>',
    zoom: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>',
    dot: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
    notes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
    full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  };
  const orn = '<div class="orn o1"></div><div class="orn o2"></div><div class="orn o3"></div><div class="orn o4"></div>';
  const d = (k, base = .5, step = .1) => `style="--d:${(base + k * step).toFixed(2)}s"`;

  // ترقيم محاور الاستكشاف
  const s2 = D.slides.filter(s => s.stage === 2 && !['activity', 'quiz', 'closing', 'classify'].includes(s.type));
  let k2 = 0;
  function kicker(sl) {
    if (sl.type === 'learn') return `<span class="kicker">قبل أن نبدأ ✦ الحصة ${tx(D.n)}</span>`;
    if (sl.type === 'activity') return `<span class="kicker">${tx(sl.kind || 'نشاط')}${sl.page ? ' ✦ ص ' + tx(sl.page) : ''}</span>`;
    if (sl.type === 'classify') return `<span class="kicker">النشاط ✦ صنّف</span>`;
    if (sl.type === 'quiz') return `<span class="kicker dk">قيّم وتوسّع ✦ تحقق من فهمك</span>`;
    if (sl.type === 'closing') return `<span class="kicker dk">الختام ✦ الحصة ${tx(D.n)}</span>`;
    if (sl.stage === 1) return `<span class="kicker">قدّم وحفّز ✦ نبدأ بسؤال</span>`;
    if (s2.includes(sl)) { k2 += 1; return `<span class="kicker dim">علّم وطبّق ✦ ${tx(k2)}/${tx(s2.length)}</span>`; }
    return `<span class="kicker dim">علّم وطبّق</span>`;
  }
  const head = (sl, title) => `<div class="head"><div class="a" style="--d:.05s">${kicker(sl)}</div>
    <div class="title-row a" style="--d:.15s"><div class="tline"></div><h2 class="slide-title">${tx(title)}</h2><div class="tline"></div></div></div>`;
  const fig = (name, extra = '') => name && A.figs[name] ? `<div class="fig a" ${extra} data-zoom="${name}"><img src="${A.figs[name]}" alt=""><span class="zoom">${I.zoom}</span></div>` : '';
  const rowsHTML = (items, base = .45, cls = '') => `<div class="rows ${items.length >= 5 ? 'two' : ''} ${cls}">${items.map((t, i) =>
    `<div class="rrow a" ${d(i, base)}><span class="num">${tx(i + 1)}</span><span>${tx(t)}</span></div>`).join('')}</div>`;
  const flipHint = (t) => `<div class="hint">${I.flip}${t}</div>`;

  const R = {};
  R.cover = () => `<section class="slide" data-notes="">${orn}<div class="body"><div class="cov-grid">
    <div class="cov-text">
      <div class="cov-logo a" style="--d:.05s"><img src="${A.logo}" alt="علي الدمخي"></div>
      <div class="cover-kicker a" style="--d:.2s">الجيولوجيا ✦ الحادي عشر العلمي ✦ الحصة ${tx(D.n)}</div>
      <div class="cover-label a" style="--d:.3s">${tx(D.lesson)}</div>
      <h1 class="cover-title a" style="--d:.4s;--ct:${D.title.length <= 14 ? 76 : D.title.length <= 24 ? 62 : D.title.length <= 36 ? 50 : 42}px">${tx(D.title)}</h1>
      <div class="motif a" style="--d:.5s">— · — · — · —</div>
      ${D.question ? `<div class="cover-q a" style="--d:.6s"><b>سؤال الحصة</b>${tx(D.question)}</div>` : ''}
    </div>
    <div class="ph-wrap a" style="--d:.3s"><div class="ph-ring"></div><div class="ph-circle"><img src="${A.cover}" alt=""></div>
      ${D.pages && D.pages !== '-' ? `<div class="ph-badge">صفحات الكتاب <b>${tx(D.pages.replace(/\s*-\s*/, '–'))}</b></div>` : ''}</div>
  </div></div></section>`;

  R.learn = sl => {
    const n = sl.items.length;
    return `<div class="body"><div class="grid" style="grid-template-columns:repeat(${n},1fr);width:${Math.min(1140, n * 300)}px">${sl.items.map((t, i) =>
      `<div class="cd big a" ${d(i, .35)}><span class="num">${tx(i + 1)}</span><p>${tx(t)}</p></div>`).join('')}</div>
      ${D.question ? `<div class="punch dk a" ${d(n, .45)}><b>سؤال الحصة:</b> ${tx(D.question)}</div>` : ''}</div>`;
  };
  R.learn.title = () => 'سنتعلّم في هذه الحصة';

  R.hook = sl => {
    const q = `<div class="qbox a" style="--d:.3s"><span class="qm">؟</span><p>${tx(sl.question)}</p></div>`;
    const sub = sl.text ? `<p class="hook-sub a" style="--d:.5s;text-align:${sl.fig ? 'right' : 'center'}">${tx(sl.text)}</p>` : '';
    const pts = sl.points && sl.points.length ? `<div class="chips">${sl.points.map((p, i) => `<span class="chip a" ${d(i, .65)}>${tx(p)}</span>`).join('')}</div>` : '';
    if (sl.fig) return `<div class="body"><div class="hook-grid"><div>${q}${sub}${pts}</div>${fig(sl.fig, 'style="--d:.4s"')}</div></div>`;
    return `<div class="body" style="max-width:1100px">${q}${sub}${pts}</div>`;
  };

  R.concepts = sl => {
    const n = sl.items.length, cols = n === 4 ? (sl.fig ? 2 : 4) : n;
    const cards = `<div class="grid" style="grid-template-columns:repeat(${cols},1fr);width:${sl.fig ? 700 : 1140}px;margin-top:${sl.fig ? 0 : 22}px">${sl.items.map((c, i) =>
      `<div class="fq a" ${d(i, .35)} style="min-height:${n > 2 || sl.fig ? 180 : 230}px"><div class="fq-inner">
        <div class="fq-face fq-front"><h4>${tx(c.term)}</h4>${flipHint('ما تعريفه؟ اضغط للكشف')}</div>
        <div class="fq-face fq-back"><div class="t">${tx(c.term)}</div><p>${tx(c.def)}</p></div></div></div>`).join('')}</div>`;
    const btn = `<button class="reveal-all a" ${d(n, .45)} data-reveal>${I.eye.replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px;margin-left:6px"')}اكشف كل التعريفات</button>`;
    if (sl.fig) return `<div class="body"><div class="hook-grid" style="grid-template-columns:700px 1fr">${`<div>${cards}<div style="text-align:center">${btn}</div></div>`}${fig(sl.fig, 'style="--d:.3s"')}</div></div>`;
    return `<div class="body">${cards}${btn}</div>`;
  };

  R.bullets = sl => {
    const lead = sl.lead ? `<p class="lead a" style="--d:.3s">${tx(sl.lead)}</p>` : '';
    if (sl.fig) return `<div class="body">${lead}<div class="hook-grid" style="grid-template-columns:1fr 430px;margin-top:14px"><div>${rowsHTML(sl.items).replace('class="rows', 'style="width:100%;margin-top:0" class="rows')}</div>${fig(sl.fig, 'style="--d:.35s"')}</div></div>`;
    return `<div class="body">${lead}${rowsHTML(sl.items)}</div>`;
  };

  R.table = sl => {
    const lead = sl.lead ? `<p class="lead a" style="--d:.3s">${tx(sl.lead)}</p>` : '';
    const dense = sl.rows.length > 4 || sl.headers.length > 3 ? 'dense' : '';
    return `<div class="body">${lead}<table class="tbl a ${dense}" style="--d:.4s"><thead><tr>${sl.headers.map(h => `<th>${tx(h)}</th>`).join('')}</tr></thead>
      <tbody>${sl.rows.map((r, i) => `<tr class="a" ${d(i, .5, .08)}>${r.map(c => `<td>${tx(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      ${sl.note ? `<div class="punch a" ${d(sl.rows.length, .6, .08)}>${tx(sl.note)}</div>` : ''}</div>`;
  };

  R.compare = sl => {
    const side = (x, k) => `<div class="mv ${x.tone || 'neutral'} a" style="--d:${.35 + k * .15}s"><span class="tag">${x.tone === 'bad' ? I.x : x.tone === 'good' ? I.ok : I.dot}${tx(x.label)}</span>
      <ul>${x.items.map(t => `<li>${tx(t)}</li>`).join('')}</ul></div>`;
    return `<div class="body"><div class="vs">${side(sl.a, 0)}${side(sl.b, 1)}</div>${sl.note ? `<div class="punch a" style="--d:.7s">${tx(sl.note)}</div>` : ''}</div>`;
  };

  R.steps = sl => {
    const n = sl.items.length, w = 1150 / n;
    const lead = sl.lead ? `<p class="lead a" style="--d:.3s">${tx(sl.lead)}</p>` : '';
    return `<div class="body">${lead}<div class="steps" style="grid-template-columns:repeat(${n},1fr)"><div class="rail" style="right:${w / 2}px;left:${w / 2}px"></div>${sl.items.map((s, i) =>
      `<div class="stp a" ${d(i, .4, .15)}><span class="num">${tx(i + 1)}</span><div class="bx"><h4>${tx(s.title)}</h4><p>${tx(s.text)}</p></div></div>`).join('')}</div>
      ${sl.note ? `<div class="punch a" ${d(n, .5, .15)}>${tx(sl.note)}</div>` : ''}</div>`;
  };

  R.rule = sl => `<div class="body"><div class="def-box a" style="--d:.3s"><span class="lb">${tx(sl.label)}</span><p>${tx(sl.text)}</p></div>
    ${sl.note ? `<div class="punch a" style="--d:.55s">${tx(sl.note)}</div>` : ''}</div>`;

  R.example = sl => {
    const left = `<div><div class="scn a" style="--d:.3s"><span class="lb">موقف</span><div>${tx(sl.scenario)}</div></div>
      <div class="rev">${rowsHTML(sl.points, .4).replace('class="rows', 'style="width:100%;margin-top:14px" class="rows').replace(/class="rrow a"/g, 'class="rrow a hid"')}</div>
      <div style="text-align:center"><button class="rev-btn a" style="--d:.5s" data-next>${I.eye}اكشف الخطوة التالية</button></div>
      ${sl.conclusion ? `<div class="punch dk concl" style="display:none;margin-inline:auto">${tx(sl.conclusion)}</div>` : ''}</div>`;
    return `<div class="body"><div class="ex-grid ${sl.fig ? 'wf' : ''}">${left}${fig(sl.fig, 'style="--d:.35s"')}</div></div>`;
  };

  R.figure = sl => `<div class="body figure-slide"><div style="width:${A.dims[sl.fig] && A.dims[sl.fig][0] / A.dims[sl.fig][1] > 1.9 ? 1100 : 820}px">${fig(sl.fig, 'style="--d:.3s"')}</div>
    <p class="fig-cap a" style="--d:.5s">${tx(sl.caption)}</p></div>`;

  R.activity = sl => `<div class="body"><div class="act-top">
      <div class="scn a" style="--d:.3s"><span class="act-kind">${tx(sl.kind || 'نشاط')}</span>
        ${sl.scenario ? `<div>${tx(sl.scenario)}</div>` : ''}
        ${sl.tools && sl.tools.length ? `<div class="tools">${sl.tools.map(t => `<span>${tx(t)}</span>`).join('')}</div>` : ''}</div>
      <div class="timer a" style="--d:.35s"><span class="ic">${I.clock}مؤقّت النشاط</span><span class="clk">– : –</span>
        <span class="bt"><button data-t="180">${tx(3)} د</button><button data-t="300">${tx(5)} د</button><button data-t="0">■</button></span></div></div>
    ${rowsHTML(sl.tasks, .45).replace('class="rows', 'style="width:1140px;margin-top:16px" class="rows')}</div>`;

  R.gallery = sl => {
    const n = sl.items.length, cols = n <= 3 ? n : n === 4 ? 4 : 3, rows = Math.ceil(n / cols);
    const gh = rows > 1 ? (sl.lead ? 128 : 150) : (n <= 2 ? 330 : n === 3 ? 290 : 240);
    const lead = sl.lead ? `<p class="lead a" style="--d:.3s">${tx(sl.lead)}</p>` : '';
    return `<div class="body">${lead}<div class="gal" style="grid-template-columns:repeat(${cols},1fr);--gh:${gh}px;width:${Math.min(1150, cols * (n <= 2 ? 460 : 380))}px">${sl.items.map((g, i) =>
      `<div class="gi a" ${d(i, .35)} data-zoom="${g.fig}"><div class="im"><img src="${A.figs[g.fig] || ''}" alt=""></div><h4>${tx(g.label)}</h4>${g.sub ? `<p>${tx(g.sub)}</p>` : ''}</div>`).join('')}</div></div>`;
  };

  R.classify = sl => {
    const n = sl.bins.length;
    const order = sl.items.map((x, i) => i).sort((a, b) => ((a * 7 + 3) % 11) - ((b * 7 + 3) % 11));
    return `<div class="body">${sl.lead ? `<p class="lead a" style="--d:.3s">${tx(sl.lead)}</p>` : ''}
      <div class="cls-pool a" style="--d:.4s">${order.map(i => `<span class="cls-chip" data-bin="${sl.items[i].bin}">${tx(sl.items[i].t)}</span>`).join('')}</div>
      <div class="cls-bins" style="grid-template-columns:repeat(${n},1fr)">${sl.bins.map((b, i) => `<div class="cls-bin a" ${d(i, .5)} data-b="${i}"><h4>${tx(b)}</h4><div class="in"></div></div>`).join('')}</div>
      <div class="cls-bar a" style="--d:.8s"><button data-cls="all">ضع الكل في مكانه</button><button data-cls="reset">أعد النشاط</button></div>
      <div class="cls-hint">ناقش زملاءك ثم اضغط على كل بطاقة لترى سلّتها الصحيحة</div></div>`;
  };
  R.classify.title = sl => sl.title;

  R.quiz = sl => {
    const n = sl.items.length, cols = n === 4 ? 2 : n;
    return `<div class="body"><div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${sl.items.map((q, i) =>
      `<div class="fq a" ${d(i, .35)} style="min-height:${n > 3 ? 170 : 220}px"><div class="fq-inner">
        <div class="fq-face fq-front has-tag"><span class="tag">س${tx(i + 1)}</span><div class="q">${tx(q.q)}</div>${flipHint('اضغط لكشف الإجابة')}</div>
        <div class="fq-face fq-back"><div class="t">الإجابة</div><p>${tx(q.a)}</p></div></div></div>`).join('')}</div>
      <button class="reveal-all a" ${d(n, .45)} data-reveal>اكشف كل الإجابات</button></div>`;
  };
  R.quiz.title = sl => sl.title || 'تحقق من فهمك';

  R.closing = sl => `<div class="body"><div class="close-grid">
      <div>${rowsHTML(sl.summary, .35).replace('class="rows', 'style="width:100%;margin-top:0;grid-template-columns:1fr" class="rows')}</div>
      <div class="hw a" style="--d:.5s"><h3>${I.book}التقويم اللاصفي</h3>${sl.homework.map(t => `<p>${tx(t)}</p>`).join('')}</div></div>
      ${D.next ? `<div class="punch a" style="--d:.8s">الحصة القادمة ✦ ${tx(D.next)}</div>` : ''}</div>`;
  R.closing.title = () => 'خلاصة الحصة';

  // ——— البناء
  const stage = document.getElementById('stage');
  let html = R.cover();
  for (const sl of D.slides) {
    const f = R[sl.type]; if (!f) continue;
    const title = f.title ? f.title(sl) : sl.title;
    html += `<section class="slide" data-notes="${esc(sl.notes || '')}">${orn}${head(sl, title)}${f(sl)}</section>`;
  }
  html += `<div class="pop" id="zoom"><div class="pbox"><button class="x">✕</button><img alt=""></div></div>
    <div id="notes"></div><div id="dots"></div><div id="counter"></div>
    <div id="tools"><button data-tool="notes" title="ملاحظات المعلم (N)">${I.notes}</button><button data-tool="full" title="ملء الشاشة (F)">${I.full}</button>${A.index ? `<button data-tool="home" title="كل الدروس">${I.home}</button>` : ''}</div>
    <div id="foot"><span class="nm">علي الدمخي</span><span class="bar"></span><span>الجيولوجيا ١١ ✦ الحصة ${tx(D.n)}: ${tx(D.title)}</span></div>`;
  stage.innerHTML = html;

  // ——— التنقّل (منطق المعاتيق)
  const slides = [...stage.querySelectorAll('.slide')];
  slides.forEach(s => { const p = s.querySelector('.cls-pool'); if (p) s._pool = p.outerHTML; });
  let cur = 0;
  const dots = document.getElementById('dots'), notes = document.getElementById('notes');
  slides.forEach((s, i) => { const e = document.createElement('span'); e.onclick = () => go(i); dots.appendChild(e); });
  // يختار أكبر حجم خطٍّ (--fz) يتّسع له المحتوى، ثم يصغّر بالتحويل إن لم يكفِ الحدّ الأدنى
  function fitBody(s) {
    const b = s.querySelector('.body'); if (!b) return;
    b.style.transform = ''; b.style.justifyContent = ''; b.style.removeProperty('--figmax');
    const fits = () => {
      const kids = [...b.children];
      const need = kids.reduce((a, c) => a + c.offsetHeight + parseFloat(getComputedStyle(c).marginTop || 0), 0);
      const faces = [...b.querySelectorAll('.fq-face, .stp .bx, .cd')].every(e => e.scrollHeight <= e.clientHeight + 2);
      return { ok: faces && need <= b.clientHeight * .995 && b.scrollWidth <= b.clientWidth + 2, need };
    };
    let fz = 1.3, done = false;
    // الصور أولاً: جرّب ارتفاعات أصغر للصورة قبل تصغير الخط تحت ١
    if (b.querySelector('.fig')) {
      for (const fm of [430, 390, 350, 310, 280]) {
        b.style.setProperty('--figmax', fm + 'px');
        for (fz = 1.3; fz >= .95; fz = +(fz - .05).toFixed(2)) { b.style.setProperty('--fz', fz); if (fits().ok) { done = true; break; } }
        if (done) break;
      }
    }
    if (!done) for (fz = 1.3; fz > .8; fz = +(fz - .05).toFixed(2)) { b.style.setProperty('--fz', fz); if (fits().ok) break; }
    const r = fits();
    const k = Math.min(1, b.clientHeight / r.need, b.clientWidth / b.scrollWidth);
    if (!r.ok && k < .99) { b.style.justifyContent = 'flex-start'; b.style.transform = `scale(${Math.max(.6, k)})`; }
  }
  function go(i, fromHash) {
    if (i < 0 || i >= slides.length) return;
    slides[cur].classList.remove('active');
    cur = i;
    const s = slides[cur];
    s.classList.remove('active'); void s.offsetWidth; s.classList.add('active');
    fitBody(s);
    document.getElementById('progress').style.width = ((cur + 1) / slides.length * 100) + '%';
    [...dots.children].forEach((e, j) => e.classList.toggle('on', j === cur));
    document.getElementById('counter').textContent = toAr(cur + 1) + ' / ' + toAr(slides.length);
    notes.innerHTML = s.dataset.notes ? '<b>ملاحظة للمعلم:</b>' + s.dataset.notes : '<b>ملاحظة للمعلم:</b>—';
    if (!fromHash && location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
    closePops();
  }
  const pops = [...stage.querySelectorAll('.pop')];
  function closePops() { pops.forEach(p => p.classList.remove('on')); }
  const popOpen = () => pops.some(p => p.classList.contains('on'));
  pops.forEach(p => { p.addEventListener('click', e => { if (e.target === p) closePops(); }); p.querySelector('.x').onclick = closePops; });
  stage.addEventListener('click', e => {
    const z = e.target.closest('[data-zoom]');
    if (z && A.figs[z.dataset.zoom]) { const p = document.getElementById('zoom'); p.querySelector('img').src = A.figs[z.dataset.zoom]; p.classList.add('on'); return; }
    const fq = e.target.closest('.fq'); if (fq) { fq.classList.toggle('open'); return; }
    const rv = e.target.closest('[data-reveal]');
    if (rv) { const all = [...rv.closest('.slide').querySelectorAll('.fq')]; const open = all.every(c => c.classList.contains('open')); all.forEach(c => c.classList.toggle('open', !open)); return; }
    const nx = e.target.closest('[data-next]');
    if (nx) {
      const sl = nx.closest('.slide'), h = sl.querySelector('.rev .rrow.hid');
      if (h) h.classList.remove('hid');
      if (!sl.querySelector('.rev .rrow.hid')) { nx.disabled = true; const c = sl.querySelector('.concl'); if (c) { c.style.display = 'block'; c.classList.add('a'); } }
      return;
    }
    const ch = e.target.closest('.cls-chip');
    if (ch) { const sl = ch.closest('.slide'); const bin = sl.querySelector(`.cls-bin[data-b="${ch.dataset.bin}"] .in`); const sp = document.createElement('span'); sp.innerHTML = ch.innerHTML; bin.appendChild(sp); ch.remove(); return; }
    const cb = e.target.closest('[data-cls]');
    if (cb) {
      const sl = cb.closest('.slide');
      if (cb.dataset.cls === 'all') sl.querySelectorAll('.cls-chip').forEach(c => c.click());
      else { const pool = sl.querySelector('.cls-pool'); const fresh = document.createElement('div'); fresh.innerHTML = sl._pool; pool.replaceWith(fresh.firstChild); sl.querySelectorAll('.cls-bin .in').forEach(b => b.innerHTML = ''); }
      return;
    }
    const tb = e.target.closest('[data-t]'); if (tb) { timer(tb); return; }
    const tl = e.target.closest('[data-tool]'); if (tl) tool(tl.dataset.tool);
  });
  // مؤقّت النشاط
  let tint = null;
  function timer(b) {
    const box = b.closest('.timer'), clk = box.querySelector('.clk');
    clearInterval(tint); clk.classList.remove('run', 'end');
    let t = +b.dataset.t; const show = () => clk.textContent = toAr(String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'));
    show(); if (!t) return;
    clk.classList.add('run');
    tint = setInterval(() => { t -= 1; show(); if (t <= 0) { clearInterval(tint); clk.classList.remove('run'); clk.classList.add('end'); } }, 1000);
  }
  function tool(t) {
    if (t === 'notes') notes.classList.toggle('on');
    if (t === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
    if (t === 'home' && A.index) location.href = A.index;
  }
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { closePops(); return; }
    if (popOpen()) return;
    if (e.key === 'n' || e.key === 'N' || e.key === 'ى') { tool('notes'); return; }
    if (e.key === 'f' || e.key === 'F' || e.key === 'ب') { tool('full'); return; }
    if (['ArrowLeft', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (['ArrowRight', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') go(0); if (e.key === 'End') go(slides.length - 1);
  });
  let tx0 = null;
  addEventListener('touchstart', e => tx0 = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (tx0 === null || popOpen()) { tx0 = null; return; } const dx = e.changedTouches[0].clientX - tx0; if (dx > 60) go(cur + 1); else if (dx < -60) go(cur - 1); tx0 = null; });
  function fit() { stage.style.transform = 'scale(' + Math.min(innerWidth / 1280, innerHeight / 720) + ')'; }
  addEventListener('resize', fit); fit();
  // إصلاحٌ على المعاتيق: التنقّل عند تغيّر الرقم في الرابط
  addEventListener('hashchange', () => { const h = parseInt(location.hash.slice(1)); if (!isNaN(h) && h - 1 !== cur) go(h - 1, true); });
  if (location.hash.includes('demo')) setTimeout(() => stage.querySelectorAll('.slide.active .fq').forEach(c => c.classList.add('open')), 900);
  const h0 = parseInt(location.hash.slice(1));
  document.fonts && document.fonts.ready.then(() => fitBody(slides[cur]));
  go(!isNaN(h0) && h0 >= 1 && h0 <= slides.length ? h0 - 1 : 0, true);
})();
</script></body></html>
